name: Refresh AgentenProfile Styles

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/bump-agentenprofile-styles.py"
      - ".github/workflows/refresh-agentenprofile-styles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update stylesheet versions
        run: python .github/scripts/bump-agentenprofile-styles.py
      - name: Commit updated AgentenProfiles
        run: |
          if git diff --quiet -- agenten; then
            echo "No AgentenProfile changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenten
          git commit -m "Refresh stylesheet cache across AgentenProfiles [skip ci]"
          git push

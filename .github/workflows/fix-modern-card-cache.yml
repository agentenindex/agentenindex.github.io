name: Fix modern card cache

on:
  push:
    paths:
      - "_modern-card-cache/trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cache bust and logo dimensions
        run: python .github/scripts/fix-modern-card-cache.py

      - name: Commit cache fix
        run: |
          rm -rf _modern-card-cache
          rm -f .github/workflows/fix-modern-card-cache.yml
          rm -f .github/scripts/fix-modern-card-cache.py
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Fix modern AgentenProfil card stylesheet cache [skip ci]"
          git push origin main

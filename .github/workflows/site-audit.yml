name: AgentenIndex full SEO GEO audit
on:
  push:
    paths:
      - '_audit/trigger'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit static site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import json, re, collections, xml.etree.ElementTree as ET

          root = Path('.')
          html_files = [p for p in root.rglob('*.html') if '.git' not in p.parts]

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.title=''; self._intitle=False; self.h1=[]; self._h1=False; self._buf=''
                  self.meta=[]; self.links=[]; self.a=[]; self.img=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='title': self._intitle=True
                  elif tag=='h1': self._h1=True; self._buf=''
                  elif tag=='meta': self.meta.append(d)
                  elif tag=='link': self.links.append(d)
                  elif tag=='a': self.a.append(d)
                  elif tag=='img': self.img.append(d)
                  elif tag=='script': self.scripts.append(d)
              def handle_data(self, data):
                  if self._intitle: self.title += data
                  if self._h1: self._buf += data
              def handle_endtag(self, tag):
                  if tag=='title': self._intitle=False
                  if tag=='h1':
                      self.h1.append(self._buf.strip())
                      self._h1=False

          def parse(p):
              s=p.read_text(encoding='utf-8', errors='replace')
              parser=P(); parser.feed(s)
              return s, parser

          def meta_value(p, name=None, prop=None):
              for m in p.meta:
                  if name and m.get('name','').lower()==name.lower(): return m.get('content','')
                  if prop and m.get('property','').lower()==prop.lower(): return m.get('content','')
              return ''

          def canonical(p):
              for l in p.links:
                  if 'canonical' in l.get('rel','').lower(): return l.get('href','')
              return ''

          def route_for_file(path):
              if path.name=='index.html':
                  rel=path.parent.as_posix()
                  return '/' if rel=='.' else '/'+rel.strip('/')+'/'
              return '/'+path.as_posix()

          def local_exists(href):
              if not href or href.startswith(('#','mailto:','tel:','javascript:')): return True
              u=urlparse(href)
              if u.scheme and u.netloc and u.netloc!='agentenindex.de': return True
              path=unquote(u.path)
              if not path.startswith('/'): return True
              rel=path.lstrip('/')
              if not rel: return (root/'index.html').exists()
              candidates=[root/rel, root/rel/'index.html']
              return any(x.exists() for x in candidates)

          titles=collections.defaultdict(list)
          descs=collections.defaultdict(list)
          issues=collections.defaultdict(list)
          routes=set()
          parsed={}
          jsonld_types=collections.Counter()

          for f in html_files:
              s,p=parse(f); parsed[f]=(s,p)
              route=route_for_file(f); routes.add(route)
              title=p.title.strip(); desc=meta_value(p,'description'); can=canonical(p)
              titles[title].append(str(f)); descs[desc].append(str(f))
              if not title: issues['missing_title'].append(str(f))
              if not desc: issues['missing_description'].append(str(f))
              if len(title)>65: issues['long_title'].append(f"{f}:{len(title)}:{title}")
              if len(desc)>170: issues['long_description'].append(f"{f}:{len(desc)}")
              if len(p.h1)!=1: issues['h1_count'].append(f"{f}:{len(p.h1)}")
              expected='https://agentenindex.de'+route
              if can!=expected: issues['canonical_mismatch'].append(f"{f}:{can} != {expected}")
              if not meta_value(p, prop='og:title'): issues['missing_og_title'].append(str(f))
              if not meta_value(p, prop='og:description'): issues['missing_og_description'].append(str(f))
              if not meta_value(p, prop='og:image'): issues['missing_og_image'].append(str(f))
              if not meta_value(p, 'twitter:card'): issues['missing_twitter_card'].append(str(f))
              if not any('icon' in l.get('rel','').lower() for l in p.links): issues['missing_favicon_link'].append(str(f))
              for a in p.a:
                  href=a.get('href','')
                  if not local_exists(href): issues['broken_internal_link'].append(f"{f} -> {href}")
              for img in p.img:
                  if 'alt' not in img: issues['img_missing_alt_attr'].append(f"{f}:{img.get('src','')}")
                  if img.get('src','').startswith('/') and not local_exists(img.get('src')): issues['broken_image'].append(f"{f}:{img.get('src')}")
              # JSON-LD
              for m in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', s, re.I|re.S):
                  try:
                      obj=json.loads(m.group(1))
                      def walk(x):
                          if isinstance(x,dict):
                              t=x.get('@type')
                              if isinstance(t,str): jsonld_types[t]+=1
                              elif isinstance(t,list):
                                  for q in t: jsonld_types[str(q)]+=1
                              for v in x.values(): walk(v)
                          elif isinstance(x,list):
                              for v in x: walk(v)
                      walk(obj)
                  except Exception as e:
                      issues['invalid_jsonld'].append(f"{f}:{e}")

          for t, fs in titles.items():
              if t and len(fs)>1: issues['duplicate_title'].append(f"{t} :: {len(fs)} files")
          for d, fs in descs.items():
              if d and len(fs)>1: issues['duplicate_description'].append(f"{d[:120]} :: {len(fs)} files")

          # Sitemap
          sitemap_urls=[]
          try:
              tree=ET.parse('sitemap.xml')
              ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
              for u in tree.findall('.//s:url',ns):
                  loc=u.find('s:loc',ns)
                  lm=u.find('s:lastmod',ns)
                  sitemap_urls.append((loc.text.strip() if loc is not None else '', lm.text.strip() if lm is not None else ''))
          except Exception as e:
              issues['sitemap_parse'].append(str(e))

          sitemap_routes=set()
          for url,lm in sitemap_urls:
              u=urlparse(url)
              sitemap_routes.add(u.path)
              if not lm: issues['sitemap_missing_lastmod'].append(url)
              if not local_exists(url): issues['sitemap_missing_file'].append(url)
          for route in sorted(routes):
              if route=='/404.html': continue
              if route not in sitemap_routes:
                  issues['html_missing_from_sitemap'].append(route)

          # robots
          robots=Path('robots.txt').read_text(encoding='utf-8') if Path('robots.txt').exists() else ''
          if 'Sitemap: https://agentenindex.de/sitemap.xml' not in robots:
              issues['robots'].append('sitemap directive missing')
          if 'Disallow: /' in robots:
              issues['robots'].append('site-wide disallow found')

          # llms
          llms=Path('llms.txt').read_text(encoding='utf-8') if Path('llms.txt').exists() else ''
          if not llms: issues['llms'].append('missing')
          if '/data/agents.json' not in llms: issues['llms'].append('machine-readable data not referenced')
          if '/methodik/' not in llms: issues['llms'].append('methodik not referenced')

          print("AUDIT_SUMMARY")
          print("html_files",len(html_files))
          print("sitemap_urls",len(sitemap_urls))
          print("jsonld_types",dict(jsonld_types))
          for k in sorted(issues):
              vals=issues[k]
              print(f"ISSUE {k} count={len(vals)}")
              for v in vals[:25]: print(" -",v)
              if len(vals)>25: print(" - ...",len(vals)-25,"more")

          # Sample content signals for GEO
          for sample in ['index.html','agenten/claude-code/index.html','wissen/was-ist-ein-ki-agent/index.html','methodik/index.html','ueber/index.html']:
              p=Path(sample)
              if p.exists():
                  s,_=parsed.get(p,parse(p))
                  text_only=re.sub(r'<[^>]+>',' ',s)
                  text_only=re.sub(r'\s+',' ',text_only)
                  print("SAMPLE",sample,"chars",len(text_only),"has_sources",('Quelle' in text_only or 'Primärquelle' in text_only),"has_updated",('Stand:' in text_only or 'Prüfdatum' in text_only),"has_faq",('FAQ' in text_only or 'Häufige Fragen' in text_only))
          PY

name: Validate Aktuelles

on:
  push:
    branches: [main]
    paths:
      - "aktuelles/**"
      - "rss/**"
      - "data/aktuelles.json"
      - "news-sitemap.xml"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "assets/styles.css"
      - "assets/app.js"
      - "index.html"
      - ".github/scripts/validate-aktuelles.py"
      - ".github/workflows/aktuelles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shared JavaScript
        run: node --check assets/app.js
      - name: Validate Aktuelles
        run: python .github/scripts/validate-aktuelles.py

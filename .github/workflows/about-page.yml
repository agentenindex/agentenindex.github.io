name: Validate About Page

on:
  push:
    branches: [main]
    paths:
      - "ueber/**"
      - "assets/styles.css"
      - ".github/scripts/validate-about-page.py"
      - ".github/workflows/about-page.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate About trust authority page
        run: python .github/scripts/validate-about-page.py

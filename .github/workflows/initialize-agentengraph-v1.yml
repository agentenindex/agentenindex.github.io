name: Initialize AgentenGraph v1

on:
  push:
    paths:
      - "_agentengraph-v1/trigger"

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update public methodology
        run: python .github/scripts/rollout-agentengraph-v1.py

      - name: Build AgentenGraph baseline
        run: python .github/scripts/build-agentengraph.py

      - name: Validate graph integrity
        run: python .github/scripts/validate-agentengraph.py

      - name: Test historical change tracking
        run: python .github/scripts/test-agentengraph-history.py

      - name: Test idempotent rebuild
        run: |
          git add _agentengraph
          git diff --cached --binary > /tmp/graph-first.diff
          python .github/scripts/build-agentengraph.py
          python .github/scripts/validate-agentengraph.py
          git add _agentengraph
          git diff --cached --binary > /tmp/graph-second.diff
          cmp /tmp/graph-first.diff /tmp/graph-second.diff
          echo "AGENTENGRAPH_IDEMPOTENT_OK"

      - name: Commit initialized graph
        run: |
          rm -rf _agentengraph-v1
          rm -f .github/workflows/initialize-agentengraph-v1.yml
          rm -f .github/scripts/rollout-agentengraph-v1.py
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Initialize AgentenGraph v1 history layer [skip ci]"
          git push origin main

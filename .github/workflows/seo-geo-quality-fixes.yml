name: AgentenIndex SEO GEO quality fixes

on:
  push:
    paths:
      - '_seo-fix/trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated SEO GEO fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re

          ROOT = Path('.')
          TODAY = '2026-10-01'

          source_replacements = {
              'https://docs.uipath.com/agents/automation-cloud/latest/user-guide/about-uipath-agents':
                  'https://docs.uipath.com/agents/automation-cloud/latest/user-guide/about-agents',
              'https://www.gumloop.com/blog/subagents':
                  'https://www.gumloop.com/blog/subagents-launch',
              'https://www.augmentcode.com/product/agent':
                  'https://www.augmentcode.com/blog/meet-augment-agent',
          }

          text_replacements = [
              ('Profil auf AgentenProfil v2 umgestellt', 'Profil auf AgentenProfil 2.0 umgestellt'),
              ('Neuaufnahme mit AgentenProfil v2', 'Neuaufnahme mit AgentenProfil 2.0'),
              ('AgentenProfil v2 mit Primärquellen', 'AgentenProfil 2.0 mit Primärquellen'),
              ('Agenten-Passports', 'AgentenProfile'),
              ('Agenten-Passport v2', 'AgentenProfil 2.0'),
              ('Agenten-Passport', 'AgentenProfil'),
              ('Master-Passport', 'Master-Profil'),
              ('Passport 2.0', '2.0'),
              ('110 ausführlichen AgentenProfile', '110 ausführlichen AgentenProfilen'),
              ('ausführlichen, quellenbasierten AgentenProfile', 'ausführlichen, quellenbasierten AgentenProfilen'),
              ('einen AgentenProfil', 'ein AgentenProfil'),
              ('eines AgentenProfile', 'eines AgentenProfils'),
              ('einem AgentenProfile', 'einem AgentenProfil'),
              ('mit AgentenProfile ', 'mit AgentenProfilen '),
              ('von AgentenProfile ', 'von AgentenProfilen '),
              ('zu AgentenProfile ', 'zu AgentenProfilen '),
              ('AgentenProfil v2', 'AgentenProfil'),
              ('passport_version', 'profile_version'),
              ('- 57 dokumentierte Agenten und Plattformen', '- 110 dokumentierte Agenten und Plattformen'),
              ('alle 57 Agentenprofile', 'alle 110 Agentenprofile'),
              ('## Agent profiles', '## AgentenProfile'),
          ]

          allowed = {'.html','.json','.md','.txt','.xml'}
          changed_files = set()

          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, new_url in source_replacements.items():
                  new = new.replace(old, new_url)
              for old, repl in text_replacements:
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed_files.add(str(path))

          # Normalize machine-readable data and preserve the meaning of last_verified.
          data_path = ROOT/'data/agents.json'
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data['schema_version'] = '5.1'
          data['updated'] = TODAY
          source_slugs = {'uipath-agents','gumloop-agents','augment-code-agent'}
          source_change = 'Quellenlink auf die aktuelle offizielle Anbieter-Dokumentation aktualisiert; inhaltliche Einordnung unverändert.'
          for agent in data['agents']:
              # The public schema now uses profile_version consistently.
              if 'passport_version' in agent:
                  agent['profile_version'] = agent.pop('passport_version')
              if agent['slug'] in source_slugs:
                  if not any(c.get('date')==TODAY and c.get('type')=='source_maintenance' for c in agent.get('changelog',[])):
                      agent.setdefault('changelog',[]).insert(0,{
                          'date': TODAY,
                          'type': 'source_maintenance',
                          'change': source_change,
                      })
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          changed_files.add(str(data_path))

          # Add source-maintenance changelog row to the three affected public profiles.
          row = '<div class="change-row"><time datetime="2026-10-01">1. Oktober 2026</time><p>'+source_change+'</p></div>'
          for slug in source_slugs:
              p = ROOT/'agenten'/slug/'index.html'
              text = p.read_text(encoding='utf-8')
              if source_change not in text:
                  text = text.replace('<h2>Changelog</h2>', '<h2>Changelog</h2>'+row, 1)
              p.write_text(text,encoding='utf-8')
              changed_files.add(str(p))

          # Stable, consistent favicon/social discovery on every real HTML page.
          icon_snippet = (
              '<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png"/>'
              '<link rel="shortcut icon" href="/favicon.ico"/>'
              '<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>'
              '<link rel="manifest" href="/site.webmanifest"/>'
              '<meta name="theme-color" content="#9a7a33"/>'
          )
          social_snippet = (
              '<meta content="https://agentenindex.de/assets/agentenindex-og-1200x630.jpg" property="og:image"/>'
              '<meta content="1200" property="og:image:width"/>'
              '<meta content="630" property="og:image:height"/>'
              '<meta content="AgentenIndex – KI-Agenten verstehen, finden und vergleichen" property="og:image:alt"/>'
              '<meta content="summary_large_image" name="twitter:card"/>'
              '<meta content="https://agentenindex.de/assets/agentenindex-og-1200x630.jpg" name="twitter:image"/>'
          )
          icon_link = re.compile(r'<link\b(?=[^>]*\brel=["\'](?:icon|shortcut icon|apple-touch-icon|apple-touch-icon-precomposed|manifest)["\'])[^>]*>\s*', re.I)
          theme_meta = re.compile(r'<meta\b(?=[^>]*\bname=["\']theme-color["\'])[^>]*>\s*', re.I)
          social_meta = re.compile(r'<meta\b(?=[^>]*(?:property=["\']og:image(?::(?:width|height|alt))?["\']|name=["\']twitter:(?:card|image)["\']))[^>]*>\s*', re.I)

          for p in sorted(ROOT.rglob('*.html')):
              if '.git' in p.parts or p.name.startswith('google76153e357fd68b75'):
                  continue
              text = p.read_text(encoding='utf-8')
              if '<head' not in text.lower():
                  continue
              new = icon_link.sub('', text)
              new = theme_meta.sub('', new)
              new = social_meta.sub('', new)
              if p.name == '404.html':
                  insert = icon_snippet
              else:
                  insert = icon_snippet + social_snippet
              new = re.sub(r'</head>', insert+'</head>', new, count=1, flags=re.I)
              if new != text:
                  p.write_text(new,encoding='utf-8')
                  changed_files.add(str(p))

          # Improve the explicit site-name signal without adding speculative identity data.
          home = ROOT/'index.html'
          text = home.read_text(encoding='utf-8')
          needle = '"@type":"WebSite","@id":"https://agentenindex.de/#website","name":"AgentenIndex","url":"https://agentenindex.de/","inLanguage"'
          replacement = '"@type":"WebSite","@id":"https://agentenindex.de/#website","name":"AgentenIndex","alternateName":"AgentenIndex.de","url":"https://agentenindex.de/","inLanguage"'
          if needle in text and '"alternateName":"AgentenIndex.de"' not in text:
              text = text.replace(needle,replacement,1)
          home.write_text(text,encoding='utf-8')
          changed_files.add(str(home))

          # Real sitewide nomenclature/metadata maintenance happened on 1 October.
          sitemap = ROOT/'sitemap.xml'
          st = sitemap.read_text(encoding='utf-8').replace('<lastmod>2026-09-30</lastmod>','<lastmod>2026-10-01</lastmod>')
          sitemap.write_text(st,encoding='utf-8')
          changed_files.add(str(sitemap))

          # Update structured page-modified dates, but keep editorial verification dates unchanged.
          for p in sorted(ROOT.rglob('*.html')):
              if '.git' in p.parts or p.name.startswith('google76153e357fd68b75'):
                  continue
              text = p.read_text(encoding='utf-8')
              new = text.replace('"dateModified":"2026-09-30"','"dateModified":"2026-10-01"')
              if new != text:
                  p.write_text(new,encoding='utf-8')
                  changed_files.add(str(p))

          # Validation
          banned = [
              'AgentenPassport','AgentenPassports','Agenten-Passport','Agenten-Passports',
              'AgentenProfil v2','Passport 2.0','passport_version',
              '57 dokumentierte Agenten und Plattformen','alle 57 Agentenprofile'
          ]
          leftovers=[]
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in allowed:
                  continue
              try: text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              for b in banned:
                  if b in text: leftovers.append((str(p),b,text.count(b)))
          assert not leftovers, leftovers[:30]

          # Known grammar regressions must be gone.
          grammar_bad = [
              r'\\bausführlichen AgentenProfile\\b',
              r'\\bquellenbasierten AgentenProfile\\b',
              r'\\beinen AgentenProfil\\b',
              r'\\beines AgentenProfile\\b',
          ]
          for p in ROOT.rglob('*.html'):
              if p.name.startswith('google76153e357fd68b75'): continue
              text=p.read_text(encoding='utf-8')
              for pattern in grammar_bad:
                  assert not re.search(pattern, text), (p,pattern)

          # Data contract.
          data=json.loads(data_path.read_text(encoding='utf-8'))
          assert data['count']==110 and len(data['agents'])==110
          assert data['schema_version']=='5.1' and data['updated']==TODAY
          assert len({a['slug'] for a in data['agents']})==110
          assert len({a['profile_id'] for a in data['agents']})==110
          assert all('profile_version' in a for a in data['agents'])
          assert all('passport_version' not in a for a in data['agents'])
          for slug in source_slugs:
              a=next(a for a in data['agents'] if a['slug']==slug)
              assert any(c.get('type')=='source_maintenance' and c.get('date')==TODAY for c in a['changelog'])

          # All canonical pages get the same stable brand/social metadata.
          canonical_count=0
          for p in ROOT.rglob('*.html'):
              if p.name.startswith('google76153e357fd68b75') or p.name=='404.html':
                  continue
              text=p.read_text(encoding='utf-8')
              if 'rel="canonical"' not in text: continue
              canonical_count+=1
              assert text.count('/favicon-48x48.png')==1, p
              assert text.count('/favicon.ico')==1, p
              assert text.count('/apple-touch-icon.png')==1, p
              assert text.count('/site.webmanifest')==1, p
              assert text.count('property="og:image"')==1, p
              assert text.count('name="twitter:image"')==1, p
              assert 'summary_large_image' in text, p
          assert canonical_count==144, canonical_count

          # All three replaced sources must be present, old URLs absent.
          source_set = {
              src[1]
              for agent in data['agents']
              for src in agent.get('sources',[])
              if len(src) > 1
          }
          for old,new in source_replacements.items():
              assert old not in source_set, old
              assert new in source_set, new

          print('Changed files:',len(changed_files))
          print('Canonical pages normalized:',canonical_count)
          print('Data schema:',data['schema_version'],'agents:',data['count'])
          PY

      - name: Remove one-time audit tooling
        shell: bash
        run: |
          rm -rf _qa _seo-fix
          rm -f .github/workflows/full-seo-geo-audit.yml
          rm -f .github/workflows/seo-geo-quality-fixes.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Polish SEO GEO metadata, terminology and source hygiene [skip ci]"
          git push origin main

name: Roll out AgentenIndex brand v8.1

on:
  push:
    paths:
      - "_brand-v81/trigger"

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install render and browser dependencies
        run: |
          pip install pillow cairosvg
          npm install --no-save puppeteer-core@latest

      - name: Generate brand assets and update site
        run: python .github/scripts/rollout-brand-v81.py

      - name: Start local site
        run: |
          python -m http.server 8080 >/tmp/agentenindex-brand-http.log 2>&1 &
          sleep 2

      - name: Browser smoke test
        run: node .github/scripts/brand-v81-smoke.mjs

      - name: Commit tested brand rollout
        run: |
          rm -rf _brand-v81
          rm -f .github/workflows/brand-v81.yml
          rm -f .github/scripts/rollout-brand-v81.py
          rm -f .github/scripts/brand-v81-smoke.mjs
          rm -rf node_modules package-lock.json package.json
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Roll out new AgentenIndex brand and favicon [skip ci]"
          git push origin main

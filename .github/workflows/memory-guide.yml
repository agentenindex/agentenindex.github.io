name: Validate Memory Guide

on:
  push:
    branches: [main]
    paths:
      - "wissen/memory/**"
      - "assets/styles.css"
      - ".github/scripts/validate-memory-guide.py"
      - ".github/workflows/memory-guide.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate memory authority guide
        run: python .github/scripts/validate-memory-guide.py

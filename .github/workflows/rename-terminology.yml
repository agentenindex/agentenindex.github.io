name: Rename AgentenIndex terminology

on:
  push:
    paths:
      - '_terminology/trigger'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace terminology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ("AgentenPassports", "AgentenProfile"),
              ("AgentenPassport", "AgentenProfil"),
              ("agentenpassports", "agentenprofile"),
              ("agentenpassport", "agentenprofil"),
              ("AgentenCheck", "Agenten-Check"),
          ]

          allowed = {".html", ".json", ".md", ".txt", ".xml"}
          changed = []
          counts = {old: 0 for old, _ in replacements}

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              new = text
              for old, replacement in replacements:
                  n = new.count(old)
                  if n:
                      counts[old] += n
                      new = new.replace(old, replacement)

              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))

          print("Changed files:", len(changed))
          for old, n in counts.items():
              print(f"{old}: {n} replacements")

          # Validation: old branding must be gone from all relevant text files.
          leftovers = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for old, _ in replacements:
                  if old in text:
                      leftovers.append((str(path), old))

          if leftovers:
              raise SystemExit("Old terminology remains: " + repr(leftovers[:20]))

          # Guard the external Agenten-Check URL: terminology changes must not alter it.
          index = Path("index.html").read_text(encoding="utf-8")
          assert "https://check.agentenindex.de/" in index
          assert "Agenten-Check" in index
          assert "AgentenProfil" in index or "AgentenProfile" in index
          PY

      - name: Commit terminology update
        shell: bash
        run: |
          rm -rf _terminology
          rm -f .github/workflows/rename-terminology.yml
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Rename AgentenPassport and AgentenCheck terminology [skip ci]"
          git push origin main

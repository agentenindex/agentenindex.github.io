name: Fix AgentenIndex wordmark

on:
  push:
    paths:
      - "_v812-fix/trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply robust wordmark fix
        run: python .github/scripts/fix-wordmark-v812.py

      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@latest

      - name: Start local site
        run: |
          python -m http.server 8080 >/tmp/agentenindex-v812-http.log 2>&1 &
          sleep 2

      - name: Browser smoke test
        run: node .github/scripts/v812-smoke.mjs

      - name: Commit tested wordmark fix
        run: |
          rm -rf _v812-fix
          rm -f .github/workflows/v812-fix.yml
          rm -f .github/scripts/fix-wordmark-v812.py
          rm -f .github/scripts/v812-smoke.mjs
          rm -rf node_modules package-lock.json package.json
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Fix AgentenIndex header wordmark rendering [skip ci]"
          git push origin main

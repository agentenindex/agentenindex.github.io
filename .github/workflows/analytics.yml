name: Validate Privacy Analytics

on:
  push:
    branches: [main]
    paths:
      - "assets/app.js"
      - "datenschutz/**"
      - "**/*.html"
      - ".github/scripts/validate-analytics.py"
      - ".github/workflows/analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Umami analytics integration
        run: python .github/scripts/validate-analytics.py

name: Validate AgentenFit

on:
  push:
    branches: [main]
    paths:
      - "fit/**"
      - "assets/fit.js"
      - "assets/app.js"
      - "assets/styles.css"
      - "data/fit-methodology.json"
      - "data/agents.json"
      - "data/agent-deep-evidence.json"
      - "data/agent-deep-taxonomy.json"
      - ".github/scripts/validate-agentenfit.py"
      - ".github/workflows/agentenfit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate AgentenFit
        run: python .github/scripts/validate-agentenfit.py

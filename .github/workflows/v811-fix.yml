name: Fix AgentenIndex logo and hero

on:
  push:
    paths:
      - "_v811-fix/trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply visual fix
        run: python .github/scripts/fix-logo-hero-v811.py

      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@latest

      - name: Start local site
        run: |
          python -m http.server 8080 >/tmp/agentenindex-v811-http.log 2>&1 &
          sleep 2

      - name: Browser smoke test
        run: node .github/scripts/v811-smoke.mjs

      - name: Commit tested fix
        run: |
          rm -rf _v811-fix
          rm -f .github/workflows/v811-fix.yml
          rm -f .github/scripts/fix-logo-hero-v811.py
          rm -f .github/scripts/v811-smoke.mjs
          rm -rf node_modules package-lock.json package.json
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Fix AgentenIndex logo fit and hero text clipping [skip ci]"
          git push origin main

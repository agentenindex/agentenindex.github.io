name: Install provider logo system

on:
  push:
    paths:
      - "_provider-logos/trigger"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build provider logos
        run: |
          npm install --no-save simple-icons@latest
          node .github/scripts/build-provider-logos.mjs

      - name: Inject provider logos
        run: python .github/scripts/inject-provider-logos.py

      - name: Commit logo rollout
        run: |
          rm -rf _provider-logos
          rm -f .github/workflows/provider-logos.yml
          rm -f .github/scripts/build-provider-logos.mjs
          rm -f .github/scripts/inject-provider-logos.py
          rm -rf node_modules package-lock.json package.json
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add provider logos across AgentenIndex [skip ci]"
          git push origin main

name: Audit Live Domain

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait briefly for Pages edge propagation
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 20
      - name: Audit live HTTPS, canonical host and crawler access
        run: python .github/scripts/audit-live-domain.py

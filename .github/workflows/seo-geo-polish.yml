name: SEO GEO content polish
on:
  push:
    paths:
      - '_seo-geo-polish/trigger'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified SEO GEO improvements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, html as htmlmod

          ROOT=Path('.')
          TODAY='2026-10-01'
          GITHUB='https://github.com/agentenindex'
          LOGO='https://agentenindex.de/assets/agentenindex-profile-1024.png'

          # 1) Remove known stale terminology/count remnants in human-facing text files.
          text_ext={'.html','.md','.txt','.json','.xml'}
          replacements=[
              ('57 Agenten','110 Agenten'),
              ('57 dokumentierte Agenten','110 dokumentierte Agenten'),
              ('Agenten-Passports','AgentenProfile'),
              ('Agenten-Passport','AgentenProfil'),
          ]
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in text_ext:
                  continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              n=s
              for a,b in replacements: n=n.replace(a,b)
              if n!=s: p.write_text(n,encoding='utf-8')

          # 2) Update Gemini Deep Research to current official sources verified 1 Oct 2026.
          data_path=Path('data/agents.json')
          data=json.loads(data_path.read_text(encoding='utf-8'))
          gem=next(a for a in data['agents'] if a['slug']=='gemini-deep-research')
          gem['sources']=[
              ['Google Hilfe – Deep Research in Gemini-Apps',
               'https://support.google.com/gemini/answer/15719111?hl=de-DE'],
              ['Google – Introducing Deep Research and Deep Research Max',
               'https://blog.google/innovation-and-ai/models-and-research/gemini-models/next-generation-gemini-deep-research/']
          ]
          gem['source_count']=2
          gem['last_verified']=TODAY
          gem.setdefault('filters',{})['last_verified']=TODAY
          if not gem.get('changelog') or gem['changelog'][0].get('date')!=TODAY:
              gem.setdefault('changelog',[]).insert(0,{
                  'date':TODAY,
                  'type':'source_maintenance',
                  'change':'Offizielle Google-Quellen aktualisiert und Deep-Research-Profil erneut gegen die aktuelle Gemini-Hilfe geprüft.'
              })
          data_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          gp=Path('agenten/gemini-deep-research/index.html')
          s=gp.read_text(encoding='utf-8')
          s=s.replace('https://support.google.com/gemini/answer/15719111?hl=en',
                      'https://support.google.com/gemini/answer/15719111?hl=de-DE')
          s=s.replace('Google Help – Use Deep Research in Gemini Apps',
                      'Google Hilfe – Deep Research in Gemini-Apps')
          s=s.replace('https://support.google.com/mail/answer/17127708?hl=en',
                      'https://blog.google/innovation-and-ai/models-and-research/gemini-models/next-generation-gemini-deep-research/')
          s=s.replace('Google Workspace Help – Deep Research',
                      'Google – Introducing Deep Research and Deep Research Max')
          s=s.replace('Prüfdatum: 30. September 2026','Prüfdatum: 1. Oktober 2026')
          s=s.replace('<b>30. September 2026</b><span>letzte Prüfung</span>',
                      '<b>1. Oktober 2026</b><span>letzte Prüfung</span>')
          s=s.replace('<small>Prüfdatum</small><b>30. September 2026</b>',
                      '<small>Prüfdatum</small><b>1. Oktober 2026</b>')
          s=s.replace('Letzte redaktionelle Prüfung: 30. September 2026.',
                      'Letzte redaktionelle Prüfung: 1. Oktober 2026.')
          s=s.replace('Das Profil wurde am 30. September 2026',
                      'Das Profil wurde am 1. Oktober 2026')
          marker='<section class="changelog" id="changelog"><p class="kicker">Änderungsverlauf</p><h2>Changelog</h2>'
          newrow='<div class="change-row"><time datetime="2026-10-01">1. Oktober 2026</time><p>Offizielle Google-Quellen aktualisiert und Deep-Research-Profil erneut gegen die aktuelle Gemini-Hilfe geprüft.</p></div>'
          if marker in s and 'Offizielle Google-Quellen aktualisiert' not in s:
              s=s.replace(marker,marker+newrow)
          gp.write_text(s,encoding='utf-8')

          # 3) Tighten the two genuinely overlong meta descriptions.
          descs={
              'agenten/chatgpt-deep-research/index.html':
                'ChatGPT Deep Research erklärt: Rechercheplan, Web- und Dateiquellen, Einsatz, Grenzen, Datenschutz, Vergleich und offizielle OpenAI-Quellen.',
              'agenten/ai-by-zapier/index.html':
                'AI by Zapier (ehemals Zapier Agents) erklärt: Funktionsweise, Anwendungen, Stärken, Grenzen, Datenschutz, Kosten und offizielle Quellen.'
          }
          for fn,newdesc in descs.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              s=re.sub(r'(<meta content=")[^"]*(" name="description"/>)',
                       lambda m:m.group(1)+htmlmod.escape(newdesc,quote=True)+m.group(2),s,count=1)
              s=re.sub(r'(<meta content=")[^"]*(" property="og:description"/>)',
                       lambda m:m.group(1)+htmlmod.escape(newdesc,quote=True)+m.group(2),s,count=1)
              # Update WebPage description in JSON-LD where possible.
              pat=re.compile(r'(<script type="application/ld\+json">)(.*?)(</script>)',re.S)
              m=pat.search(s)
              if m:
                  obj=json.loads(htmlmod.unescape(m.group(2)))
                  graph=obj.get('@graph',[])
                  for node in graph:
                      if isinstance(node,dict) and node.get('@type')=='WebPage':
                          node['description']=newdesc
                  payload=json.dumps(obj,ensure_ascii=False,separators=(',',':'))
                  s=s[:m.start(2)]+payload+s[m.end(2):]
              p.write_text(s,encoding='utf-8')

          # Helpers for JSON-LD schema cleanup.
          def canonical_from_html(s):
              m=re.search(r'<link href="([^"]+)" rel="canonical"/>',s)
              return m.group(1) if m else None
          def h1_from_html(s):
              m=re.search(r'<h1[^>]*>(.*?)</h1>',s,re.S|re.I)
              if not m: return ''
              return re.sub(r'<[^>]+>','',htmlmod.unescape(m.group(1))).strip()
          def title_from_html(s):
              m=re.search(r'<title>(.*?)</title>',s,re.S|re.I)
              return re.sub(r'<[^>]+>','',htmlmod.unescape(m.group(1))).strip() if m else ''
          def desc_from_html(s):
              m=re.search(r'<meta content="([^"]*)" name="description"/>',s,re.I)
              return htmlmod.unescape(m.group(1)) if m else ''

          # 4) Standardize entity identity + editorial Article schema on knowledge pages.
          for p in ROOT.rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              pat=re.compile(r'(<script type="application/ld\+json">)(.*?)(</script>)',re.S)
              m=pat.search(s)
              if not m: continue
              try: obj=json.loads(htmlmod.unescape(m.group(2)))
              except Exception: continue
              graph=obj.get('@graph')
              if not isinstance(graph,list): continue

              # Organization identity: stable logo + external entity reference.
              for node in graph:
                  if isinstance(node,dict) and node.get('@type')=='Organization' and node.get('@id')=='https://agentenindex.de/#organization':
                      node.setdefault('logo',{'@type':'ImageObject','url':LOGO,'width':1024,'height':1024})
                      node['sameAs']=[GITHUB]

              rel=p.as_posix()
              is_knowledge=rel.startswith('wissen/') and rel!='wissen/index.html'
              if is_knowledge:
                  canonical=canonical_from_html(s)
                  headline=h1_from_html(s) or title_from_html(s).replace(' | AgentenIndex','')
                  description=desc_from_html(s)
                  page_node=None
                  for node in graph:
                      if isinstance(node,dict) and node.get('@type') in ('Article','WebPage') and str(node.get('@id','')).startswith(canonical or '§'):
                          page_node=node; break
                  if page_node:
                      old_date=page_node.get('dateModified',TODAY)
                      published=page_node.get('datePublished')
                      if not published:
                          tm=re.search(r'<time[^>]+datetime="(\d{4}-\d{2}-\d{2})"',s)
                          if tm: published=tm.group(1)
                      page_node.clear()
                      page_node.update({
                          '@type':'Article',
                          '@id':canonical+'#article',
                          'headline':headline,
                          'description':description,
                          'dateModified':old_date,
                          'inLanguage':'de-DE',
                          'author':{'@type':'Organization','name':'AgentenIndex','url':'https://agentenindex.de/ueber/'},
                          'publisher':{'@id':'https://agentenindex.de/#organization'},
                          'mainEntityOfPage':canonical
                      })
                      if published: page_node['datePublished']=published

                  if not any(isinstance(n,dict) and n.get('@type')=='BreadcrumbList' for n in graph):
                      graph.append({
                          '@type':'BreadcrumbList',
                          '@id':canonical+'#breadcrumb',
                          'itemListElement':[
                              {'@type':'ListItem','position':1,'name':'Start','item':'https://agentenindex.de/'},
                              {'@type':'ListItem','position':2,'name':'Wissen','item':'https://agentenindex.de/wissen/'},
                              {'@type':'ListItem','position':3,'name':headline,'item':canonical}
                          ]
                      })

                  s=s.replace('<meta content="website" property="og:type"/>',
                              '<meta content="article" property="og:type"/>',1)
                  # Visible editorial identity (helps trust and keeps schema consistent with page).
                  if 'Redaktion: <a href="/ueber/">AgentenIndex</a>' not in s:
                      mm=re.search(r'<div class="meta">(.*?)</div>',s,re.S)
                      author='<span>Redaktion: <a href="/ueber/">AgentenIndex</a></span>'
                      if mm:
                          block=mm.group(0)
                          s=s[:mm.start()]+block[:-6]+author+'</div>'+s[mm.end():]
                      else:
                          s=s.replace('<article>','<article><div class="meta">'+author+'</div>',1)

              payload=json.dumps(obj,ensure_ascii=False,separators=(',',':'))
              # re-find script in possibly modified HTML before replacement
              m2=pat.search(s)
              if m2:
                  s=s[:m2.start(2)]+payload+s[m2.end(2):]
              p.write_text(s,encoding='utf-8')

          # 5) Rebuild llms.txt as a concise, non-duplicated discovery file for non-Google consumers.
          data=json.loads(data_path.read_text(encoding='utf-8'))
          lines=[
              '# AgentenIndex',
              '> Unabhängige deutschsprachige Referenz für KI-Agenten. Source-first, mit Prüfdatum, Primärquellen und Changelog je AgentenProfil.',
              '',
              '## Zentrale Seiten',
              '- https://agentenindex.de/ — Startseite',
              '- https://agentenindex.de/agenten/ — Verzeichnis aller 110 Agenten und Plattformen',
              '- https://agentenindex.de/wissen/ — Grundlagen und Fachwissen',
              '- https://agentenindex.de/methodik/ — Methodik, Quellenstandard und Transparenz',
              '- https://agentenindex.de/ueber/ — Über AgentenIndex',
              '',
              '## Kategorien',
              '- https://agentenindex.de/agenten/recherche/ — Recherche-Agenten',
              '- https://agentenindex.de/agenten/coding/ — Coding-Agenten',
              '- https://agentenindex.de/agenten/automatisierung/ — Automatisierungs-Agenten',
              '- https://agentenindex.de/agenten/unternehmen/ — Enterprise- und Produktivitäts-Agenten',
              '- https://agentenindex.de/agenten/service-sales/ — Service-, Sales- und Daten-Agenten',
              '- https://agentenindex.de/agenten/recht/ — Legal- und Professional-Services-Agenten',
              '',
              '## Maschinenlesbare Daten',
              '- https://agentenindex.de/data/agents.json — strukturierter Datensatz mit 110 AgentenProfilen, Quellenstatus, Prüfdatum und Changelog',
              '- https://agentenindex.de/sitemap.xml — kanonische Sitemap',
              '',
              '## Wichtige Wissensseiten',
              '- https://agentenindex.de/wissen/was-ist-ein-ki-agent/ — Definition und Einordnung',
              '- https://agentenindex.de/wissen/wie-funktionieren-ki-agenten/ — Funktionsweise',
              '- https://agentenindex.de/wissen/arten-von-ki-agenten/ — Arten von KI-Agenten',
              '- https://agentenindex.de/wissen/ki-agenten-sicherheit/ — Sicherheit und Governance',
              '- https://agentenindex.de/wissen/ki-agent-vs-chatbot/ — Agent vs. Chatbot',
              '',
              '## AgentenProfile'
          ]
          for a in data['agents']:
              lines.append(f"- https://agentenindex.de/agenten/{a['slug']}/ — {a['name']}: {a['summary']}")
          lines += [
              '',
              '## Rechtliches',
              '- https://agentenindex.de/impressum/',
              '- https://agentenindex.de/datenschutz/',
              ''
          ]
          Path('llms.txt').write_text('\n'.join(lines),encoding='utf-8')

          # Validation
          assert data['count']==110 and len(data['agents'])==110
          assert 'support.google.com/mail/answer/17127708' not in json.dumps(data)
          assert '57 Agenten' not in ''.join(
              p.read_text(encoding='utf-8',errors='ignore') for p in ROOT.rglob('*.html')
          )
          llms=Path('llms.txt').read_text(encoding='utf-8')
          profile_lines=[x for x in llms.splitlines() if x.startswith('- https://agentenindex.de/agenten/') and '/ — ' in x]
          # category links also match /agenten/, so count only profile slugs from data
          for a in data['agents']:
              assert llms.count(f"https://agentenindex.de/agenten/{a['slug']}/")==1, a['slug']
          for p in ROOT.glob('wissen/*/index.html'):
              s=p.read_text(encoding='utf-8')
              assert '"@type":"Article"' in s, p
              assert '"author":{"@type":"Organization","name":"AgentenIndex"' in s, p
              assert '"@type":"BreadcrumbList"' in s, p
              assert 'property="og:type"/>' in s and 'content="article"' in s, p
              assert 'Redaktion: <a href="/ueber/">AgentenIndex</a>' in s, p

          # Ensure the two descriptions are now concise.
          for fn in descs:
              s=Path(fn).read_text(encoding='utf-8')
              m=re.search(r'<meta content="([^"]*)" name="description"/>',s)
              assert m and len(htmlmod.unescape(m.group(1)))<170,(fn,len(m.group(1)) if m else None)
          print('SEO/GEO polish validated.')
          PY
      - name: Commit polished site and remove temporary audit tooling
        shell: bash
        run: |
          rm -rf _seo-geo-polish _audit
          rm -f .github/workflows/seo-geo-polish.yml .github/workflows/site-audit.yml
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Polish AgentenIndex SEO GEO and source quality [skip ci]"
          git push origin main

name: Publish AgentenGraph history

on:
  push:
    paths:
      - "_agentengraph-public/trigger"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render AgentenGraph history in all profiles
        run: python .github/scripts/render-agentengraph-profiles.py

      - name: Validate all AgentenGraph profile sections
        run: python .github/scripts/validate-agentengraph-profiles.py

      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@latest

      - name: Start local site
        run: |
          python -m http.server 8080 >/tmp/agentengraph-public-http.log 2>&1 &
          sleep 2

      - name: Browser smoke test
        run: node .github/scripts/agentengraph-profile-smoke.mjs

      - name: Commit tested public history
        run: |
          rm -rf _agentengraph-public
          rm -f .github/workflows/publish-agentengraph-history.yml
          rm -f .github/scripts/agentengraph-profile-smoke.mjs
          rm -rf node_modules package-lock.json package.json
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Publish AgentenGraph history in all AgentenProfiles [skip ci]"
          git push origin main

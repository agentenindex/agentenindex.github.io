name: Update AgentenGraph

on:
  push:
    branches: [main]
    paths:
      - "data/agents.json"
      - "data/agent-deep-evidence.json"
      - ".github/scripts/validate-agentengraph.py"
      - ".github/scripts/build-agentengraph.py"
      - "data/agent-deep-taxonomy.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentengraph-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build AgentenGraph
        run: python .github/scripts/build-agentengraph.py

      - name: Validate AgentenGraph
        run: python .github/scripts/validate-agentengraph.py

      - name: Test historical change tracking
        run: python .github/scripts/test-agentengraph-history.py

      - name: Render public AgentenGraph history
        run: python .github/scripts/render-agentengraph-profiles.py

      - name: Validate public AgentenGraph history
        run: python .github/scripts/validate-agentengraph-profiles.py

      - name: Commit graph history
        run: |
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add _agentengraph agenten
          if git diff --cached --quiet; then
            echo "AgentenGraph already current."
            exit 0
          fi
          git commit -m "Update AgentenGraph history [skip ci]"
          git push origin main

name: Full AgentenIndex SEO GEO audit

on:
  push:
    paths:
      - '_qa/trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run static and source audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, re, ssl

          ROOT = Path('.')
          html_files = sorted(p for p in ROOT.rglob('*.html') if '.git' not in p.parts)
          issues = []
          metrics = {}

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.title=[]; self.in_title=False
                  self.h1=0; self.meta=[]; self.links=[]; self.imgs=[]; self.scripts=[]
                  self._script=None; self.html_lang=None
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='html': self.html_lang=d.get('lang')
                  if tag=='title': self.in_title=True
                  if tag=='h1': self.h1+=1
                  if tag=='meta': self.meta.append(d)
                  if tag=='link': self.links.append(d)
                  if tag=='img': self.imgs.append(d)
                  if tag=='script' and d.get('type')=='application/ld+json':
                      self._script=[]
              def handle_endtag(self, tag):
                  if tag=='title': self.in_title=False
                  if tag=='script' and self._script is not None:
                      self.scripts.append(''.join(self._script)); self._script=None
              def handle_data(self, data):
                  if self.in_title: self.title.append(data)
                  if self._script is not None: self._script.append(data)

          def page_url(path):
              s=path.as_posix()
              if s=='index.html': return 'https://agentenindex.de/'
              if s.endswith('/index.html'): return 'https://agentenindex.de/'+s[:-10]
              return 'https://agentenindex.de/'+s

          canonical_urls=set()
          title_map={}; desc_map={}
          internal_targets=[]
          favicon_forms={}
          jsonld_errors=[]
          missing_alt=[]
          term_hits=[]

          for path in html_files:
              text=path.read_text(encoding='utf-8')
              p=P(); p.feed(text)
              title=''.join(p.title).strip()
              desc=next((m.get('content','') for m in p.meta if m.get('name','').lower()=='description'), '')
              robots=next((m.get('content','') for m in p.meta if m.get('name','').lower()=='robots'), '')
              canonical=next((l.get('href','') for l in p.links if l.get('rel','').lower()=='canonical'), '')
              favs=[l.get('href','') for l in p.links if 'icon' in l.get('rel','').lower()]
              for f in favs: favicon_forms[f]=favicon_forms.get(f,0)+1

              if path.name!='404.html':
                  if p.html_lang!='de': issues.append(('lang',str(path),p.html_lang))
                  if not title: issues.append(('missing_title',str(path),''))
                  if not desc: issues.append(('missing_description',str(path),''))
                  if p.h1!=1: issues.append(('h1_count',str(path),p.h1))
                  if not canonical: issues.append(('missing_canonical',str(path),''))
                  if 'noindex' not in robots.lower() and canonical: canonical_urls.add(canonical)
                  if not favs: issues.append(('missing_favicon',str(path),''))
              if title: title_map.setdefault(title,[]).append(str(path))
              if desc: desc_map.setdefault(desc,[]).append(str(path))

              for im in p.imgs:
                  if 'alt' not in im: missing_alt.append((str(path), im.get('src','')))
                  src=im.get('src','')
                  if src.startswith('/'):
                      target=ROOT/src.lstrip('/')
                      if not target.exists(): issues.append(('broken_image',str(path),src))

              for l in p.links:
                  href=l.get('href','')
                  if href.startswith('/') and not href.startswith('//'):
                      internal_targets.append((str(path),href))

              for s in p.scripts:
                  try: json.loads(s)
                  except Exception as e: jsonld_errors.append((str(path),str(e)))

              for term in ('AgentenPassport','Agenten-Passport','AgentenPassports','Agenten-Passports','AgentenCheck'):
                  if term in text: term_hits.append((str(path),term,text.count(term)))

          # Internal href existence
          broken_links=[]
          for source,href in internal_targets:
              clean=href.split('#',1)[0].split('?',1)[0]
              if not clean: continue
              rel=clean.lstrip('/')
              target=ROOT/rel
              if clean.endswith('/'): target=target/'index.html'
              if not target.exists(): broken_links.append((source,href))

          # Sitemap
          sitemap=(ROOT/'sitemap.xml').read_text(encoding='utf-8')
          sitemap_urls=set(re.findall(r'<loc>(.*?)</loc>',sitemap))
          missing_in_sitemap=sorted(canonical_urls-sitemap_urls)
          sitemap_noncanonical=sorted(sitemap_urls-canonical_urls)

          # Data integrity
          data=json.loads((ROOT/'data/agents.json').read_text(encoding='utf-8'))
          agents=data['agents']
          integrity={
              'declared_count':data.get('count'),
              'actual_count':len(agents),
              'unique_slugs':len({a['slug'] for a in agents}),
              'unique_ids':len({a['profile_id'] for a in agents}),
              'missing_sources':[a['slug'] for a in agents if not a.get('sources')],
              'missing_changelog':[a['slug'] for a in agents if not a.get('changelog')],
              'last_verified_dates':sorted({a.get('last_verified') for a in agents}),
              'legacy_passport_text':sum(
                  ('Passport' in json.dumps(a,ensure_ascii=False)) for a in agents
              )
          }

          # Source URL availability
          urls=[]
          for a in agents:
              for src in a.get('sources',[]):
                  if len(src)>1 and src[1].startswith('http'): urls.append(src[1])
          urls=sorted(set(urls))
          ctx=ssl.create_default_context()
          def check_url(url):
              headers={'User-Agent':'Mozilla/5.0 AgentenIndex-QA/1.0'}
              try:
                  req=Request(url,headers=headers,method='HEAD')
                  with urlopen(req,timeout=12,context=ctx) as r:
                      return url,r.status,r.geturl()
              except HTTPError as e:
                  if e.code in (403,405,429):
                      try:
                          req=Request(url,headers={**headers,'Range':'bytes=0-1024'},method='GET')
                          with urlopen(req,timeout=15,context=ctx) as r:
                              return url,r.status,r.geturl()
                      except HTTPError as ee:
                          return url,ee.code,getattr(ee,'url',url)
                      except Exception as ee:
                          return url,'ERR:'+type(ee).__name__,url
                  return url,e.code,getattr(e,'url',url)
              except Exception as e:
                  return url,'ERR:'+type(e).__name__,url

          status_counts={}
          bad_sources=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
              futs=[ex.submit(check_url,u) for u in urls]
              for fut in as_completed(futs):
                  url,status,final=fut.result()
                  key=str(status)
                  status_counts[key]=status_counts.get(key,0)+1
                  if isinstance(status,int) and status>=400:
                      bad_sources.append((url,status,final))
                  elif isinstance(status,str) and status.startswith('ERR'):
                      bad_sources.append((url,status,final))

          # Grammar / suspicious terminology context
          grammar=[]
          needles=[
              'ausführlichen AgentenProfile','mit AgentenProfile','der AgentenProfile',
              'AgentenProfil v2','Agenten-Passport','Passport'
          ]
          for path in html_files+[ROOT/'data/agents.json',ROOT/'llms.txt']:
              if not path.exists(): continue
              text=path.read_text(encoding='utf-8')
              for n in needles:
                  if n in text: grammar.append((str(path),n,text.count(n)))

          dup_titles={k:v for k,v in title_map.items() if len(v)>1}
          dup_desc={k:v for k,v in desc_map.items() if len(v)>1}

          print('=== AGENTENINDEX FULL AUDIT ===')
          print('HTML_FILES',len(html_files))
          print('CANONICAL_INDEXABLE',len(canonical_urls))
          print('SITEMAP_URLS',len(sitemap_urls))
          print('BROKEN_INTERNAL_LINKS',len(broken_links))
          for x in broken_links[:40]: print('BROKEN_LINK',x)
          print('MISSING_IN_SITEMAP',len(missing_in_sitemap))
          for x in missing_in_sitemap[:40]: print('SITEMAP_MISSING',x)
          print('SITEMAP_NONCANONICAL',len(sitemap_noncanonical))
          for x in sitemap_noncanonical[:40]: print('SITEMAP_EXTRA',x)
          print('STATIC_ISSUES',len(issues))
          for x in issues[:80]: print('STATIC_ISSUE',x)
          print('JSONLD_ERRORS',len(jsonld_errors))
          for x in jsonld_errors[:20]: print('JSONLD_ERROR',x)
          print('MISSING_ALT_ATTR',len(missing_alt))
          for x in missing_alt[:30]: print('MISSING_ALT',x)
          print('DUPLICATE_TITLES',len(dup_titles))
          for k,v in list(dup_titles.items())[:20]: print('DUP_TITLE',k,v)
          print('DUPLICATE_DESCRIPTIONS',len(dup_desc))
          for k,v in list(dup_desc.items())[:20]: print('DUP_DESC',k,v)
          print('FAVICON_FORMS',json.dumps(favicon_forms,ensure_ascii=False,sort_keys=True))
          print('TERM_HITS',len(term_hits))
          for x in term_hits[:50]: print('TERM_HIT',x)
          print('GRAMMAR_HITS',len(grammar))
          for x in grammar[:50]: print('GRAMMAR_HIT',x)
          print('DATA_INTEGRITY',json.dumps(integrity,ensure_ascii=False))
          print('SOURCE_URLS',len(urls))
          print('SOURCE_STATUS_COUNTS',json.dumps(status_counts,sort_keys=True))
          print('SOURCE_PROBLEMS',len(bad_sources))
          for x in sorted(bad_sources,key=lambda y:str(y[1]))[:100]: print('SOURCE_PROBLEM',x)
          PY

      - name: Check live HTTP basics
        shell: bash
        run: |
          set +e
          for u in             https://agentenindex.de/             https://agentenindex.de/robots.txt             https://agentenindex.de/sitemap.xml             https://agentenindex.de/llms.txt             https://agentenindex.de/agenten/             https://agentenindex.de/agenten/claude-code/             https://agentenindex.de/favicon.ico             https://agentenindex.de/favicon-48x48.png
          do
            echo "=== $u"
            curl -L -sS -o /dev/null -w "HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download} REDIRECTS=%{num_redirects} TIME=%{time_total}\n" "$u"
          done

name: Roll out modern AgentenProfil cards

on:
  push:
    paths:
      - "_modern-cards/trigger"

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Option B then Option A
        run: python .github/scripts/rollout-modern-agent-cards.py

      - name: Commit refined preview
        run: |
          git config user.name "AgentenIndex"
          git config user.email "actions@users.noreply.github.com"
          git add design-next/index.html
          git commit -m "Refine modern AgentenProfil cards preview [skip ci]" || true
          git push origin main

      - name: Commit production rollout
        run: |
          git add -A
          rm -rf _modern-cards
          rm -f .github/workflows/modern-cards-rollout.yml
          rm -f .github/scripts/rollout-modern-agent-cards.py
          git add -A
          git commit -m "Roll out modern AgentenProfil cards across AgentenIndex [skip ci]" || true
          git push origin main
